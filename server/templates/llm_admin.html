<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LLM access admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100">
  <main class="mx-auto max-w-5xl px-4 py-8">
    <header class="mb-6">
      <h1 class="text-2xl font-semibold">LLM — доступ пользователей</h1>
      <p class="mt-2 text-sm text-slate-400">
        Найдите пользователя в таблице и откройте карточку для управления доступом к AI-помощнику.
      </p>
      <p id="toast" class="mt-3 hidden rounded-xl border px-3 py-2 text-sm"></p>
    </header>

    <section class="mb-6 rounded-2xl border border-slate-800 bg-slate-900/70 p-4">
      <label class="block text-sm font-medium text-slate-200">Admin secret</label>
      <input
        id="admin-secret"
        type="password"
        placeholder="LLM_ADMIN_SECRET"
        class="mt-2 w-full rounded-xl border border-slate-700 bg-slate-950/70 px-3 py-2.5 text-sm outline-none focus:border-indigo-400 focus:ring-2 focus:ring-indigo-500/20"
      />
      <label class="mt-4 block text-sm font-medium text-slate-200">Поиск пользователя</label>
      <div class="mt-2 flex flex-wrap gap-2">
        <input
          id="search-q"
          type="search"
          placeholder="username, service_id, имя, фамилия"
          class="min-w-[12rem] flex-1 rounded-xl border border-slate-700 bg-slate-950/70 px-3 py-2.5 text-sm outline-none focus:border-indigo-400"
        />
        <button
          id="reload-btn"
          type="button"
          class="rounded-xl bg-indigo-600 px-4 py-2.5 text-sm font-medium hover:bg-indigo-500"
        >
          Найти
        </button>
      </div>
    </section>

    <section class="overflow-hidden rounded-2xl border border-slate-800">
      <div id="status" class="border-b border-slate-800 px-4 py-3 text-sm text-slate-400">
        Введите admin secret и нажмите «Найти» или Enter в поле поиска.
      </div>
      <div class="overflow-x-auto">
        <table class="min-w-full text-left text-sm">
          <thead class="bg-slate-900/80 text-slate-300">
            <tr>
              <th class="px-4 py-3 font-medium">Пользователь</th>
              <th class="px-4 py-3 font-medium">Service</th>
              <th class="px-4 py-3 font-medium">Активен</th>
              <th class="px-4 py-3 font-medium">LLM</th>
            </tr>
          </thead>
          <tbody id="users-body" class="divide-y divide-slate-800"></tbody>
        </table>
      </div>
    </section>
  </main>

  <div id="user-modal" class="fixed inset-0 z-50 hidden" aria-hidden="true">
    <div id="user-modal-backdrop" class="absolute inset-0 bg-black/70 backdrop-blur-sm"></div>
    <div class="absolute inset-0 flex items-center justify-center p-4">
      <div
        role="dialog"
        aria-modal="true"
        aria-labelledby="user-modal-title"
        class="relative max-h-[min(90vh,720px)] w-full max-w-lg overflow-y-auto rounded-2xl border border-slate-700 bg-slate-900 shadow-2xl"
      >
        <div class="sticky top-0 z-10 flex items-start justify-between gap-3 border-b border-slate-800 bg-slate-900/95 px-5 py-4 backdrop-blur">
          <div class="min-w-0">
            <h2 id="user-modal-title" class="truncate text-lg font-semibold text-slate-100">Пользователь</h2>
            <p id="user-modal-subtitle" class="mt-0.5 truncate text-xs text-slate-500"></p>
          </div>
          <button
            id="user-modal-close"
            type="button"
            class="rounded-lg border border-slate-700 px-2.5 py-1.5 text-sm text-slate-300 hover:bg-slate-800"
            aria-label="Закрыть"
          >
            ✕
          </button>
        </div>

        <div class="space-y-5 px-5 py-5">
          <section>
            <h3 class="mb-3 text-xs font-semibold uppercase tracking-wide text-slate-500">Данные пользователя</h3>
            <dl id="user-modal-fields" class="grid grid-cols-1 gap-3 sm:grid-cols-2"></dl>
          </section>

          <section class="rounded-xl border border-slate-800 bg-slate-950/50 p-4">
            <label class="flex cursor-pointer items-start gap-3">
              <input
                id="user-modal-llm-checkbox"
                type="checkbox"
                class="mt-1 h-4 w-4 rounded border-slate-600 accent-indigo-500"
              />
              <span>
                <span class="block text-sm font-medium text-slate-100">Доступ к LLM</span>
                <span class="mt-1 block text-xs text-slate-400">
                  AI-помощник и «Анализ переписки» в клиенте Kindred.
                </span>
              </span>
            </label>
          </section>

          <p id="user-modal-save-status" class="hidden text-sm"></p>

          <div class="flex flex-wrap justify-end gap-2 border-t border-slate-800 pt-4">
            <button
              id="user-modal-cancel"
              type="button"
              class="rounded-xl border border-slate-700 px-4 py-2 text-sm text-slate-200 hover:bg-slate-800"
            >
              Закрыть
            </button>
            <button
              id="user-modal-save"
              type="button"
              class="rounded-xl bg-indigo-600 px-4 py-2 text-sm font-medium text-white hover:bg-indigo-500 disabled:opacity-50"
            >
              Сохранить
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script defer src="/api/v1/llm/admin/script.js"></script>
</body>
</html>
