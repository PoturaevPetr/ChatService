# Пример nginx для llm.oclinica.ru
# Проблема: upstream (Ollama/Open WebUI) тоже отдаёт CORS → браузер видит
#   Access-Control-Allow-Origin: http://localhost:3080, http://localhost:3080
# Решение: proxy_hide_header — снять CORS с upstream, добавить один раз в nginx.

map $http_authorization $is_valid_key {
    default 0;
    "Bearer 3049d1de24cb113fa465f1b3333800c0cc51907ab8f7ebe96634aba463673a6a" 1;
}

map $http_origin $cors_allow_origin {
    default "";
    "~^https://oclinica\.ru$" $http_origin;
    "~^https://www\.oclinica\.ru$" $http_origin;
    "~^https://.*\.oclinica\.ru$" $http_origin;
    "http://localhost:3000" $http_origin;
    "http://localhost:3001" $http_origin;
    "http://127.0.0.1:3000" $http_origin;
    "http://localhost:3080" $http_origin;
    "http://127.0.0.1:3080" $http_origin;
    "capacitor://localhost" $http_origin;
    "https://localhost" $http_origin;
}

server {
    listen 443 ssl;
    server_name llm.oclinica.ru;

    # ssl_* ...

    location / {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin $cors_allow_origin always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With" always;
            add_header Access-Control-Max-Age 86400 always;
            add_header Access-Control-Allow-Credentials "true" always;
            return 204;
        }

        set $reject_origin 0;
        if ($http_origin != "") { set $reject_origin 1; }
        if ($cors_allow_origin != "") { set $reject_origin 0; }
        if ($reject_origin = 1) {
            add_header Content-Type application/json always;
            return 403 '{"error":"Forbidden origin"}';
        }

        if ($is_valid_key = 0) {
            add_header Content-Type application/json always;
            return 401 '{"error":"Invalid API key"}';
        }

        # --- Важно: убрать CORS от upstream, иначе дубликат заголовков ---
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Access-Control-Expose-Headers;

        add_header Access-Control-Allow-Origin $cors_allow_origin always;
        add_header Access-Control-Allow-Credentials "true" always;

        proxy_pass http://37.79.251.110:3641;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization "";

        proxy_connect_timeout 60s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
        client_max_body_size 10M;
    }
}
